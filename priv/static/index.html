<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor de Energia</title>
<style>
  :root{
    --surface:#0f131d; --low:#171b26; --mid:#1c1f2a; --high:#262a35; --line:#3e484f;
    --ink:#dfe2f1; --muted:#bdc8d1; --primary:#8ed5ff; --ok:#4edea3; --warn:#f59e0b; --bad:#ffb4ab;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--surface);color:var(--ink);line-height:1.5;
       font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  .wrap{max-width:1150px;margin:0 auto;padding:0 24px}
  header{background:var(--low);border-bottom:1px solid var(--line)}
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:16px 0}
  .brand{display:flex;align-items:center;gap:12px}
  .brand svg{width:26px;height:26px;fill:var(--primary)}
  h1{margin:0;font-size:24px;font-weight:600;letter-spacing:-.01em}
  .right{display:flex;align-items:center;gap:16px}
  .hora{font-family:ui-monospace,Consolas,monospace;color:var(--muted);font-size:14px}
  .pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:4px 14px;font-size:14px;font-weight:600;border:1px solid}
  .pill i{width:9px;height:9px;border-radius:50%;display:inline-block}
  .pill.ok{color:var(--ok);border-color:rgba(78,222,163,.4);background:rgba(78,222,163,.1)}
  .pill.ok i{background:var(--ok)}
  .pill.mal{color:var(--warn);border-color:rgba(245,158,11,.5);background:rgba(245,158,11,.1)}
  .pill.mal i{background:var(--warn);animation:pulso 1s infinite}
  @keyframes pulso{50%{opacity:.3}}
  main{padding:32px 0 48px}
  h2{font-size:24px;font-weight:600;margin:0 0 20px}
  section{margin-bottom:40px}
  .grid3{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
  .grid2{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
  .card{background:var(--low);border:1px solid var(--line);border-radius:12px;padding:24px}
  .card.alarma{border-color:rgba(255,180,171,.6);background:rgba(255,180,171,.05);box-shadow:0 0 18px rgba(255,180,171,.15)}
  .card.sin-alarma{border-color:rgba(78,222,163,.4);background:rgba(78,222,163,.05)}
  .etq{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .kpi{margin:12px 0 8px;display:flex;align-items:baseline;gap:8px}
  .kpi b{font-size:48px;line-height:1.1;font-weight:700;letter-spacing:-.02em}
  .kpi span{font-size:20px;color:var(--primary);font-weight:600}
  .nota{font-size:14px;color:var(--muted);margin:0}
  .piso-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:16px}
  .piso-top h3{margin:0;font-size:22px;font-weight:600}
  .tot{text-align:right}
  .tot b{display:block;font-size:24px;color:var(--primary)}
  .tot small{color:var(--muted);font-size:14px}
  .medidor{background:rgba(38,42,53,.45);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
  .medidor.alerta{border-color:rgba(245,158,11,.6)}
  .medidor.critico{border-color:var(--bad);box-shadow:0 0 18px rgba(255,180,171,.18)}
  .fila{display:flex;justify-content:space-between;align-items:center}
  .fila h4{margin:0;font-size:16px}
  .badge{border-radius:999px;border:1px solid;padding:2px 12px;font-size:12px;font-weight:700}
  .badge.normal{color:var(--ok);border-color:rgba(78,222,163,.4);background:rgba(78,222,163,.1)}
  .badge.alerta{color:var(--warn);border-color:rgba(245,158,11,.5);background:rgba(245,158,11,.1)}
  .badge.critico{color:var(--bad);border-color:rgba(255,180,171,.6);background:rgba(255,180,171,.1);animation:pulso 1.2s infinite}
  .datos{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
  .datos small{display:block;color:var(--muted);font-size:12px}
  .datos b{font-family:ui-monospace,Consolas,monospace;font-size:18px}
  .datos .kw.alerta{color:var(--warn)} .datos .kw.critico{color:var(--bad)}
  .barra{height:6px;background:var(--surface);border-radius:999px;overflow:hidden}
  .barra div{height:100%;border-radius:999px;background:var(--ok);transition:width .5s}
  .barra div.alerta{background:var(--warn)} .barra div.critico{background:var(--bad)}
  .botones{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
  button{background:transparent;border-radius:6px;padding:5px 14px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
  button:disabled{opacity:.5;cursor:default}
  .b-pico{color:var(--primary);border:1px solid rgba(142,213,255,.4)} .b-pico:hover{background:rgba(142,213,255,.1)}
  .b-falla{color:var(--bad);border:1px solid rgba(255,180,171,.4)} .b-falla:hover{background:rgba(255,180,171,.1)}
  table{width:100%;border-collapse:collapse;text-align:left;font-size:15px}
  th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em;padding:0 16px 12px 0}
  td{padding:12px 16px 12px 0;border-top:1px solid var(--line)}
  .todo-ok{display:flex;align-items:center;gap:16px}
  .todo-ok .chk{width:40px;height:40px;border-radius:50%;background:rgba(78,222,163,.15);border:1px solid rgba(78,222,163,.5);color:var(--ok);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700}
  .todo-ok b{font-size:20px;color:var(--ok);display:block}
  footer{color:var(--muted);font-size:14px;padding-bottom:32px}
  .tc{overflow-x:auto}
  .cw{color:var(--warn)} .cb{color:var(--bad)}
</style>
</head>
<body>

<header>
  <div class="wrap top">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>
      <h1>Monitor de Energia</h1>
    </div>
    <div class="right">
      <span id="hora" class="hora">--:--:--</span>
      <span id="pill" class="pill ok"><i></i><span id="pill-texto">En vivo</span></span>
    </div>
  </div>
</header>

<main class="wrap">

  <section class="grid3">
    <article class="card">
      <div class="etq">Consumo total</div>
      <div class="kpi"><b id="total-kw">--</b><span>kW</span></div>
      <p class="nota">Demanda actual de todo el edificio</p>
    </article>
    <article class="card">
      <div class="etq">Energia acumulada</div>
      <div class="kpi"><b id="total-kwh">--</b><span>kWh</span></div>
      <p class="nota">Desde que arranco el sistema</p>
    </article>
    <article id="kpi-alarmas" class="card">
      <div class="etq">Alarmas activas</div>
      <div class="kpi"><b id="total-alarmas">--</b></div>
      <p id="alarmas-detalle" class="nota">Cargando...</p>
    </article>
  </section>

  <section>
    <h2>Pisos</h2>
    <div id="pisos" class="grid2"><p class="nota">Cargando datos...</p></div>
  </section>

  <section>
    <h2>Alarmas</h2>
    <div id="alarmas" class="card"></div>
  </section>

</main>

<footer class="wrap">Monitor de Energia &middot; Erlang/OTP &middot; Datos simulados</footer>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var num = function (v, d) {
    return Number(v || 0).toLocaleString("es-MX", { minimumFractionDigits: d, maximumFractionDigits: d });
  };
  var TEXTO = { normal: "Normal", alerta: "Alerta", critico: "Critico" };
  var clase = function (e) { return TEXTO[e] ? e : "normal"; };
  var firma = "";

  function setTexto(id, v) { var e = $(id); if (e) e.textContent = v; }

  // Crea las tarjetas de piso una sola vez
  function construir(medidores) {
    var nueva = medidores.map(function (m) { return m.piso + "-" + m.id; }).join(",");
    if (nueva === firma) return;
    firma = nueva;

    var pisos = [];
    medidores.forEach(function (m) { if (pisos.indexOf(m.piso) < 0) pisos.push(m.piso); });
    pisos.sort(function (a, b) { return a - b; });

    $("pisos").innerHTML = pisos.map(function (p) {
      var filas = medidores.filter(function (m) { return m.piso === p; }).map(function (m) {
        var k = "m-" + p + "-" + m.id;
        return '<div id="' + k + '" class="medidor">' +
          '<div class="fila"><h4>Medidor ' + m.id + '</h4><span id="' + k + '-estado" class="badge normal">--</span></div>' +
          '<div class="datos">' +
            '<div><small>Consumo</small><b id="' + k + '-kw" class="kw">--</b> <small style="display:inline">kW</small></div>' +
            '<div><small>Acumulado</small><b id="' + k + '-kwh">--</b> <small style="display:inline">kWh</small></div>' +
            '<div><small>Umbral</small><b id="' + k + '-umbral">--</b> <small style="display:inline">kW</small></div>' +
          '</div>' +
          '<div class="barra"><div id="' + k + '-barra" style="width:0%"></div></div>' +
          '<div class="botones">' +
            '<button class="b-pico" data-accion="pico" data-piso="' + p + '" data-medidor="' + m.id + '" data-texto="Simular pico">Simular pico</button>' +
            '<button class="b-falla" data-accion="falla" data-piso="' + p + '" data-medidor="' + m.id + '" data-texto="Simular falla">Simular falla</button>' +
          '</div></div>';
      }).join("");

      return '<article class="card">' +
        '<div class="piso-top"><h3>Piso ' + p + '</h3>' +
        '<div class="tot"><b><span id="piso-' + p + '-kw">--</span> kW</b><small><span id="piso-' + p + '-kwh">--</span> kWh acumulados</small></div></div>' +
        filas + '</article>';
    }).join("");
  }

  function pintar(datos) {
    var medidores = datos.medidores || [];
    var alarmas = datos.alarmas || [];

    setTexto("total-kw", num(datos.total_kw, 1));
    setTexto("total-kwh", num(datos.total_kwh, 2));
    setTexto("total-alarmas", alarmas.length);

    var criticas = alarmas.filter(function (a) { return a.estado === "critico"; }).length;
    if (alarmas.length > 0) {
      $("kpi-alarmas").className = "card alarma";
      $("total-alarmas").className = "cb";
      setTexto("alarmas-detalle", criticas + " critica(s) y " + (alarmas.length - criticas) + " alerta(s)");
    } else {
      $("kpi-alarmas").className = "card sin-alarma";
      $("total-alarmas").className = "";
      setTexto("alarmas-detalle", "Todo en orden");
    }

    construir(medidores);

    (datos.pisos || []).forEach(function (p) {
      setTexto("piso-" + p.piso + "-kw", num(p.total_kw, 1));
      setTexto("piso-" + p.piso + "-kwh", num(p.total_kwh, 2));
    });

    medidores.forEach(function (m) {
      var k = "m-" + m.piso + "-" + m.id;
      var c = clase(m.estado);
      if (!$(k)) return;
      $(k).className = "medidor " + c;
      $(k + "-estado").className = "badge " + c;
      $(k + "-estado").textContent = TEXTO[c];
      $(k + "-kw").className = "kw " + c;
      setTexto(k + "-kw", num(m.kw, 1));
      setTexto(k + "-kwh", num(m.kwh, 2));
      setTexto(k + "-umbral", num(m.umbral, 1));
      var pct = m.umbral > 0 ? Math.min(100, (m.kw / m.umbral) * 100) : 0;
      $(k + "-barra").style.width = pct + "%";
      $(k + "-barra").className = c;
    });

    if (alarmas.length === 0) {
      $("alarmas").innerHTML =
        '<div class="todo-ok"><span class="chk">&#10003;</span><div><b>Todo en orden</b>' +
        '<span class="nota">Ningun medidor esta por encima de su umbral.</span></div></div>';
    } else {
      var filas = alarmas.map(function (a) {
        var c = clase(a.estado);
        return '<tr><td><b>Piso ' + a.piso + '</b></td><td>Medidor ' + a.id + '</td>' +
          '<td><span class="badge ' + c + '">' + TEXTO[c] + '</span></td>' +
          '<td class="' + (c === "critico" ? "cb" : "cw") + '">' + num(a.kw, 1) + ' kW</td>' +
          '<td>' + num(a.umbral, 1) + ' kW</td></tr>';
      }).join("");
      $("alarmas").innerHTML = '<div class="tc"><table><thead><tr><th>Piso</th><th>Medidor</th><th>Estado</th><th>Consumo</th><th>Umbral</th></tr></thead><tbody>' + filas + '</tbody></table></div>';
    }

    setTexto("hora", new Date().toLocaleTimeString("es-MX"));
  }

  function conexion(ok) {
    $("pill").className = "pill " + (ok ? "ok" : "mal");
    setTexto("pill-texto", ok ? "En vivo" : "Reconectando...");
  }

  function actualizar() {
    fetch("/api/edificio", { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (d) { pintar(d); conexion(true); })
      .catch(function (e) { console.error("Error al consultar la API:", e); conexion(false); });
  }

  document.addEventListener("click", function (ev) {
    var b = ev.target.closest("button[data-accion]");
    if (!b) return;
    var accion = b.dataset.accion;
    b.disabled = true;
    b.textContent = "Enviando...";
    fetch("/api/demo/" + accion + "/" + b.dataset.piso + "/" + b.dataset.medidor, { method: "POST" })
      .then(function (r) {
        b.textContent = r.ok ? (accion === "pico" ? "Pico enviado" : "Falla enviada") : "Error";
        actualizar();
      })
      .catch(function () { b.textContent = "Error"; })
      .then(function () {
        setTimeout(function () { b.disabled = false; b.textContent = b.dataset.texto; }, 1500);
      });
  });

  actualizar();
  setInterval(actualizar, 2000);
})();
</script>
</body>
</html>
